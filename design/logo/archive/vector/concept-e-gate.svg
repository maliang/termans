<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Termans · concept E · Gate</title>
  <defs>
    <linearGradient id="inkE" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#1B2542"/>
      <stop offset="0.55" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="amberE" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFDA92"/>
      <stop offset="0.5" stop-color="#F8AB24"/>
      <stop offset="1" stop-color="#DB6C0B"/>
    </linearGradient>
    <radialGradient id="sheenE" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowE" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#inkE)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#sheenE)"/>
  <path d="M320 700 V486 A192 192 0 0 1 704 486 V700" fill="none" stroke="#F8AB24" stroke-width="104"
        stroke-linecap="round" opacity="0.20" filter="url(#glowE)"/>

  <!-- gateway / tunnel -->
  <path d="M320 700 V486 A192 192 0 0 1 704 486 V700" fill="none" stroke="url(#amberE)" stroke-width="104"
        stroke-linecap="round"/>
  <!-- prompt inside the opening -->
  <path d="M452 560 L520 620 L452 680" fill="none" stroke="#4ADE9B" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- floor line -->
  <rect x="392" y="726" width="240" height="26" rx="13" fill="#E8932A" opacity="0.45"/>

  <rect width="1024" height="1024" rx="232" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>
</svg>
