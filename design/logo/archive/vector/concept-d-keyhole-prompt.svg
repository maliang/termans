<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Termans · concept D · Keyhole Prompt</title>
  <defs>
    <linearGradient id="inkD" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1A2440"/>
      <stop offset="0.55" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#06090F"/>
    </linearGradient>
    <linearGradient id="amberD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.5" stop-color="#F7A81F"/>
      <stop offset="1" stop-color="#DE6F0C"/>
    </linearGradient>
    <radialGradient id="sheenD" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowD" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#inkD)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#sheenD)"/>
  <ellipse cx="512" cy="470" rx="250" ry="220" fill="#F7A81F" opacity="0.12" filter="url(#glowD)"/>

  <!-- keyhole: circle + tapered stem -->
  <path fill="url(#amberD)" d="
    M512 246
    C 418 246 344 320 344 414
    C 344 486 384 548 444 578
    L 416 742
    C 412 762 428 780 448 780
    H 576
    C 596 780 612 762 608 742
    L 580 578
    C 640 548 680 486 680 414
    C 680 320 606 246 512 246
    Z"/>
  <!-- prompt caret carved out of the keyhole -->
  <path d="M462 366 L536 438 L462 510" fill="none" stroke="#0A0F1A" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect width="1024" height="1024" rx="232" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>
</svg>
