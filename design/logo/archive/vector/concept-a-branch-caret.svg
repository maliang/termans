<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Termans · concept A · Branch Caret</title>
  <defs>
    <linearGradient id="inkA" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1A2440"/>
      <stop offset="0.55" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#06090F"/>
    </linearGradient>
    <linearGradient id="amberA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.5" stop-color="#F7A81F"/>
      <stop offset="1" stop-color="#DE6F0C"/>
    </linearGradient>
    <radialGradient id="sheenA" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowA" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#inkA)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#sheenA)"/>
  <ellipse cx="470" cy="560" rx="300" ry="230" fill="#F7A81F" opacity="0.14" filter="url(#glowA)"/>

  <!-- prompt caret -->
  <path d="M282 352 L470 512 L282 672" fill="none" stroke="url(#amberA)" stroke-width="98"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- trunk wire -->
  <path d="M470 512 H628" fill="none" stroke="#F2AE45" stroke-width="54" stroke-linecap="round" opacity="0.9"/>
  <!-- branch wire -->
  <path d="M584 512 C584 402 632 348 706 336" fill="none" stroke="#4ADE9B" stroke-width="40"
        stroke-linecap="round" opacity="0.92"/>
  <!-- host nodes -->
  <circle cx="686" cy="512" r="60" fill="#4ADE9B"/>
  <circle cx="726" cy="332" r="42" fill="#4ADE9B" opacity="0.95"/>

  <rect width="1024" height="1024" rx="232" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>
</svg>
