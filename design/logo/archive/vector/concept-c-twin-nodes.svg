<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Termans · concept C · Twin Nodes</title>
  <defs>
    <linearGradient id="inkC" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1A2440"/>
      <stop offset="0.55" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#06090F"/>
    </linearGradient>
    <linearGradient id="amberC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#E8800F"/>
    </linearGradient>
    <linearGradient id="mintC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BEFA8"/>
      <stop offset="1" stop-color="#23A66F"/>
    </linearGradient>
    <radialGradient id="sheenC" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowC" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#inkC)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#sheenC)"/>
  <ellipse cx="512" cy="512" rx="320" ry="240" fill="#4ADE9B" opacity="0.10" filter="url(#glowC)"/>

  <!-- two host rings -->
  <circle cx="330" cy="512" r="128" fill="none" stroke="url(#amberC)" stroke-width="56"/>
  <circle cx="694" cy="512" r="128" fill="none" stroke="url(#mintC)" stroke-width="56"/>
  <!-- sync link with bidirectional heads -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M470 466 H554"/>
    <path d="M566 558 H482"/>
  </g>
  <path d="M470 466 l28 -22 v44 z" fill="#FFFFFF" fill-opacity="0.55"/>
  <path d="M566 558 l-28 22 v-44 z" fill="#FFFFFF" fill-opacity="0.55"/>

  <rect width="1024" height="1024" rx="232" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>
</svg>
