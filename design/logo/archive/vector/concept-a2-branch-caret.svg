<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Termans · concept A2 · Branch Caret</title>
  <defs>
    <linearGradient id="inkA2" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#1B2542"/>
      <stop offset="0.55" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="amberA2" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFDA92"/>
      <stop offset="0.5" stop-color="#F8AB24"/>
      <stop offset="1" stop-color="#DB6C0B"/>
    </linearGradient>
    <radialGradient id="sheenA2" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowA2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#inkA2)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#sheenA2)"/>
  <ellipse cx="470" cy="560" rx="310" ry="240" fill="#F8AB24" opacity="0.13" filter="url(#glowA2)"/>

  <!-- branch wire (drawn first so the caret tip sits on top) -->
  <path d="M600 512 C600 424 630 372 680 352" fill="none" stroke="#4ADE9B" stroke-width="42"
        stroke-linecap="round" opacity="0.95"/>
  <!-- trunk wire -->
  <path d="M468 512 H626" fill="none" stroke="#E8932A" stroke-width="50" stroke-linecap="round"/>
  <!-- prompt caret -->
  <path d="M284 364 L468 512 L284 660" fill="none" stroke="url(#amberA2)" stroke-width="96"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- host nodes -->
  <circle cx="684" cy="512" r="56" fill="#4ADE9B"/>
  <circle cx="692" cy="346" r="42" fill="#4ADE9B"/>

  <rect width="1024" height="1024" rx="232" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>
</svg>
