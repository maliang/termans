appId: com.termans.app
productName: Termans
copyright: Copyright © 2026 Termans

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# 私钥、known_hosts、加密库都不入包：运行时只写 app.getPath('userData')
asar: true

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
