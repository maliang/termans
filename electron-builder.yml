# electron-builder 配置（打包里程碑 P4a）
#
# 为什么放独立 yml 而不是 package.json 的 build 字段：
#   1. build 字段塞进 JSON 会变成一大段转义串，review 时看不出结构，改一个 target 就是一行长 diff；
#   2. package.json 在本项目是「依赖 + 脚本」的单写者文件（只有 architect 能改），
#      配置分离后调打包参数不必碰依赖文件，也不会触发 lockfile 相关的误改；
#   3. electron-builder 原生支持 yml，零额外依赖。
#
# 本阶段只做「能产出可运行的安装包」：不做签名 / 公证 / 自动更新（后续里程碑）。

appId: com.termans.app
productName: Termans
copyright: Copyright © 2026 Termans

directories:
  output: dist
  buildResources: build

# 收尾守卫（scripts/pack-guard.cjs）：所有产物生成之后调用，做两件事——
#   1. 断言产物 Contents/Resources/icon.icns 与 build/icon.icns、design/logo/export/termans.icns 逐字节相同，
#      并校验 CFBundleIconFile / CFBundleIdentifier / 版本号（靠断言，不靠「我记得配了」）；
#   2. 把 @electron/rebuild 就地改写过的原生模块 rebuild 回本机架构——在 arm64 机器上打 x64 包之后，
#      node_modules/cpu-features 会变成 x86_64，随后 dev / vitest / e2e 全部加载错架构的二进制。
#      恢复失败会 throw，electron-builder 直接以非 0 退出，不给「日志看着成功」的机会。
# 为什么用钩子而不只写文档：钩子对 `pnpm pack` 与 `pnpm pack:dir` 都生效，`--dir` 也会走到
# （app-builder-lib/out/index.js 在 packager.build() 之后无条件调用 afterAllArtifactBuild）。
# 构建中途崩溃时钩子不执行，所以另留手动入口 `node scripts/pack-guard.cjs restore`。
afterAllArtifactBuild: scripts/pack-guard.cjs

# files 白名单：运行期只需要三样东西。
# node_modules 的解释：electron-builder 会依据 package.json 的 dependencies 计算生产依赖闭包再采集，
# 这里显式列出来是为了「看得见 + 能加排除规则」，不是放它去扫全量 node_modules。
# 主进程 externalize 了 ssh2 / isomorphic-git / zod —— 缺任何一个，安装包里 require 就会抛。
files:
  - out/**
  - package.json
  - node_modules/**
  - '!node_modules/**/{test,__tests__,tests,docs,example,examples}/**'
  - '!node_modules/**/*.md'

# 私钥、known_hosts、加密库都不入包：运行时只写 app.getPath('userData')
asar: true

mac:
  category: public.app-category.developer-tools
  # 显式写死图标路径：不依赖「build/ 目录恰好有同名文件」这个默认巧合。
  icon: build/icon.icns
  # identity: null = 明确不签名。arm64 上 electron-builder 会退化为 ad-hoc 签名（否则内核拒载），
  # 但没有 Developer ID 身份，其它机器首次打开仍会被 Gatekeeper 拦（处理办法见 docs/ARCHITECTURE.md）。
  identity: null
  notarize: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  # 显式写死图标：win 端 electron-builder 只认 .ico，不能靠推。
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Termans

linux:
  icon: build/icon.png
  category: Development
  synopsis: Cross-platform SSH client
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
